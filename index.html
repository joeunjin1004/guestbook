<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>온라인 방명록 | Guestbook</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>온라인 방명록 📝</h1>
      <p>소중한 방문 흔적과 따뜻한 한마디를 남겨주세요.</p>
    </header>

    <!-- Configuration Warning Banner (설정이 비어 있을 때 노출) -->
    <div id="configWarning" class="alert alert-warning hidden">
      <span>⚠️ <strong>Firebase 설정이 필요합니다:</strong> <code>firebase-config.js</code> 파일에 Firebase 프로젝트 설정 정보를 입력해 주세요.</span>
    </div>

    <!-- Error Banner -->
    <div id="errorAlert" class="alert hidden">
      <span id="errorMessage"></span>
    </div>

    <!-- Guestbook Input Form -->
    <section class="form-card">
      <form id="guestbookForm">
        <div class="form-group">
          <label for="nameInput" class="form-label">작성자 이름</label>
          <input
            type="text"
            id="nameInput"
            class="form-input"
            placeholder="이름이나 닉네임을 입력하세요"
            maxlength="30"
            autocomplete="name"
            required
          />
        </div>

        <div class="form-group">
          <label for="messageInput" class="form-label">메시지</label>
          <textarea
            id="messageInput"
            class="form-textarea"
            placeholder="방명록에 남길 따뜻한 이야기를 들려주세요"
            maxlength="500"
            rows="3"
            required
          ></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span id="btnText">방명록 남기기</span>
          <span id="btnSpinner" class="spinner" style="display: none;"></span>
        </button>
      </form>
    </section>

    <!-- Guestbook Entries List -->
    <section>
      <div class="list-header">
        <h2>방명록 목록</h2>
        <span id="messageCount" class="badge">0개의 메시지</span>
      </div>

      <div id="guestbookList" class="guestbook-list">
        <div id="loadingBox" class="status-box">
          <p>방명록 글을 불러오는 중입니다...</p>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
